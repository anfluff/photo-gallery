# The photo gallery at photos.apraksin.xyz. Its GitHub deploy copies the built
# site to /srv/apraksin/photos/site. The image files are not in git, and
# scripts/upload-photos.sh copies them to /srv/apraksin/photos/images.
server {
    listen 80;
    server_name photos.apraksin.xyz;
    root /srv/photos/site;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # An image file is named by a hash of the original photo and the build
    # names its assets by their content, so a browser may keep both for good.
    # If the thumbnails are ever made again at another size, they need a new
    # folder name, or browsers keep showing the old ones.
    location /photos/ {
        root /srv/photos/media;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}

# The budget tracker at budget.apraksin.xyz, behind a password. Its GitHub
# deploy copies the page to /srv/apraksin/budget/site and writes the password
# file from the BASIC_AUTH_USERS secret. Without that file nginx refuses every
# request.
server {
    listen 80;
    server_name budget.apraksin.xyz;
    root /srv/budget/site;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript;
    gzip_min_length 1024;

    auth_basic "apraksin";
    auth_basic_user_file /srv/budget/auth/htpasswd;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Any other name gets no answer.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
