name: Deploy

# Builds the site and copies it to the server. The image files are not in git,
# so this does not carry them. scripts/upload-photos.sh copies them.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Copy the site to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo "The DEPLOY_SSH_KEY secret is missing"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key can only write to the folder of this site, so the target path is empty.
          # New files land before old ones are removed, so a page that is loading keeps its assets.
          rsync -rtz --delete-after -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes" \
            dist/ apraksin-deploy@photos.apraksin.xyz:
